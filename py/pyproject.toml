[project]
name = "aas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Subomi-olagoke", email = "solagoke21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pymongo>=4.19.0",
    "pyreadr>=0.5.8",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
